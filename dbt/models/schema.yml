version: 2

models:
  - name: stg_ehr_events
    description: "Deduplicated, trimmed and parsed events with a row_status tag."
    columns:
      - name: row_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['kept', 'missing_case_id', 'missing_or_bad_timestamp', 'unknown_activity']

  - name: event_log
    description: "Clean event log used by PM4Py and the dashboard."
    columns:
      - name: case_id
        data_tests:
          - not_null
      - name: event_timestamp
        data_tests:
          - not_null
      - name: activity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Registration', 'Triage', 'Doctor Consultation', 'X-Ray',
                         'Lab Test', 'Treatment', 'Discharge', 'Admission']
      - name: event_order
        data_tests:
          - not_null
